    <g fill="#FFFFFF" stroke="#DCCBAE"><rect x="80" y="762" width="88" height="28" rx="5"/><rect x="194" y="762" width="88" height="28" rx="5"/><rect x="308" y="762" width="88" height="28" rx="5"/></g>
    <g fill="#3F4A54"><text x="88" y="780">T-2 Q3 data</text><text x="202" y="780">T-3 Summary</text><text x="316" y="780">T-1 Export</text></g>
  </g>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="444" y="740" width="84" height="28" rx="6" fill="#E3F1E6" stroke="#3C8D5A" stroke-width="1.5"/><text x="486" y="758" fill="#2B6B43">Checked</text>
    <rect x="552" y="740" width="84" height="28" rx="6" fill="#E2EAF6" stroke="#2F6DB5" stroke-width="1.5"/><text x="594" y="758" fill="#24548C">Ask Anna</text>
    <rect x="660" y="740" width="84" height="28" rx="6" fill="#FFFFFF" stroke="#9A8F7E" stroke-width="1.5" stroke-dasharray="4 3"/><text x="702" y="758" fill="#5B5246">Write</text>
    <rect x="768" y="740" width="84" height="28" rx="6" fill="#FFFFFF" stroke="#9A8F7E" stroke-width="1.5" stroke-dasharray="4 3"/><text x="810" y="758" fill="#5B5246">Send</text>
    <rect x="660" y="778" width="84" height="26" rx="6" fill="#F8E1DC" stroke="#C24A3A" stroke-width="1.5"/><text x="702" y="795" fill="#9C3527">Deadline?</text>
  </g>
  <g fill="none" stroke="#9A8F7E" stroke-width="1.5" marker-end="url(#aS)">
    <path d="M529 754h18"/><path d="M637 754h18"/><path d="M745 754h18"/>
