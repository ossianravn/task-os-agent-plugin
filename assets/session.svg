  <path d="M80 404a16 16 0 0 1 16-16h288a16 16 0 0 1 16 16v14H80z" fill="#C2603A"/>
  <path d="M440 404a16 16 0 0 1 16-16h288a16 16 0 0 1 16 16v14H440z" fill="#1F3A5F"/>
  <path d="M800 404a16 16 0 0 1 16-16h288a16 16 0 0 1 16 16v14H800z" fill="#2A7A76"/>

  <g fill="#1F2A33">
    <text x="104" y="456" font-size="21" font-weight="700">Where we stopped</text>
    <text x="104" y="484" font-size="15" fill="#6E6558">handoffs · views/overview.md</text>
    <text x="104" y="518" font-size="15" fill="#3F4A54">goal · state · blockers</text>
    <text x="104" y="540" font-size="15" fill="#3F4A54">a next action per workstream</text>

    <text x="464" y="456" font-size="21" font-weight="700">What's going on</text>
    <text x="464" y="484" font-size="15" fill="#6E6558">tasks/ · records/</text>
    <text x="464" y="518" font-size="15" fill="#3F4A54">tasks with owner and next step</text>
    <text x="464" y="540" font-size="15" fill="#3F4A54">findings, and what they rest on</text>

    <text x="824" y="456" font-size="21" font-weight="700">Who and how</text>
    <text x="824" y="484" font-size="15" fill="#6E6558">people/ · systems/ · ways of working</text>
    <text x="824" y="518" font-size="15" fill="#3F4A54">who decides, how you reach what</text>
    <text x="824" y="540" font-size="15" fill="#3F4A54">how to write to whom</text>
  </g>
  <rect x="990" y="436" width="112" height="26" rx="13" fill="#DCEFEC"/>
  <text x="1046" y="454" font-size="13" font-weight="600" fill="#2A7A76" text-anchor="middle">from setup</text>

  <!-- reads, look-ups, checks and writes -->
  <g fill="none" stroke-width="2.5">
    <path d="M290 174C285 260 255 300 248 380" stroke="#C2603A" stroke-dasharray="7 7" marker-end="url(#aR)"/>
    <path d="M360 174C400 270 540 300 560 380" stroke="#1F3A5F" stroke-dasharray="7 7" marker-end="url(#aN)"/>
    <path d="M520 174C580 290 900 290 930 380" stroke="#2A7A76" stroke-dasharray="7 7" marker-end="url(#aT)"/>
    <path d="M680 174C676 260 640 300 630 380" stroke="#1F3A5F" stroke-dasharray="7 7" marker-end="url(#aN)"/>
    <path d="M850 174C830 270 720 300 700 380" stroke="#1F3A5F" marker-end="url(#aN)"/>
    <path d="M1124 174C1180 210 1176 330 1176 470V598Q1176 616 1158 616H258Q240 616 240 598V564" stroke="#C2603A" marker-end="url(#aR)"/>
  </g>

  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="243" y="248" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#E9C9B8"/><text x="275" y="266" fill="#C2603A">reads</text>
    <rect x="410" y="252" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/><text x="442" y="270" fill="#1F3A5F">reads</text>
    <rect x="819" y="313" width="86" height="26" rx="13" fill="#FFFFFF" stroke="#BFDDD9"/><text x="862" y="331" fill="#2A7A76">looks up</text>
    <rect x="622" y="266" width="70" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/><text x="657" y="284" fill="#1F3A5F">checks</text>
    <rect x="780" y="226" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/><text x="812" y="244" fill="#1F3A5F">writes</text>
    <rect x="1124" y="300" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#E9C9B8"/><text x="1156" y="318" fill="#C2603A">writes</text>
  </g>
  <text x="708" y="644" font-size="14" font-weight="600" fill="#C2603A" text-anchor="middle">the next session, in either agent, starts here</text>
  <!-- the live board, drawn from work/ -->
  <path d="M128 588V688" fill="none" stroke="#A87A1E" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#aM)"/>
  <rect x="62" y="626" width="132" height="26" rx="13" fill="#FFFFFF" stroke="#E6D3A8"/>
  <text x="128" y="644" font-size="14" font-weight="600" fill="#A87A1E" text-anchor="middle">drawn from work/</text>

  <g filter="url(#sh)"><rect x="48" y="694" width="1104" height="118" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/></g>
  <path d="M48 710a16 16 0 0 1 16-16h1072a16 16 0 0 1 16 16v14H48z" fill="#F1E7D6"/>
  <circle cx="72" cy="709" r="5" fill="#D9C9AE"/><circle cx="90" cy="709" r="5" fill="#D9C9AE"/><circle cx="108" cy="709" r="5" fill="#D9C9AE"/>
  <text x="132" y="714" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A7B55">LIVE BOARD, WITH PELE BOARD</text>
  <text x="1132" y="714" font-size="13" fill="#8A7D6B" text-anchor="end">127.0.0.1 · in your browser</text>

  <g font-size="12">
