  <g font-size="15" fill="#3F4A54">
    <text x="888" y="752"><tspan font-weight="700" fill="#1F2A33">brief</tspan> draws it each session</text>
    <text x="888" y="775"><tspan font-weight="700" fill="#1F2A33">capture</tspan> moves the cards</text>
    <text x="888" y="798"><tspan font-weight="700" fill="#1F2A33">handoff</tspan> redraws the plan</text>
