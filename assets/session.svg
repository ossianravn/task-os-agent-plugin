<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">What a Task OS session reads and writes</title>
  <desc id="d">Your agent loads AGENTS.md, briefs from where you stopped and what is going on, looks up who and how while it works, checks anything that goes out against the records with verify, captures tasks, decisions and findings, and writes a handoff per workstream that the next session starts from. With Pele Board, brief, capture and handoff draw the tasks and where you stopped on a live board in your browser, drawn from work/.</desc>
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1F3A5F"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A7A76"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2603A"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3A386"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A87A1E"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9A8F7E"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5B4A30" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="838" rx="28" fill="#FBF7EF" stroke="#E9DEC9" stroke-width="2"/>

  <text x="48" y="60" font-size="15" font-weight="700" letter-spacing="2" fill="#9A7B55">EVERY SESSION, IN CLAUDE CODE OR CODEX</text>

  <!-- session steps -->
  <g font-size="19" font-weight="600" fill="#1F2A33">
    <g filter="url(#sh)">
      <rect x="48" y="86" width="160" height="84" rx="16" fill="#F1E7D6" stroke="#DCCBAE"/>
      <rect x="237" y="86" width="160" height="84" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/>
      <rect x="426" y="86" width="160" height="84" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/>
      <rect x="614" y="86" width="160" height="84" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/>
      <rect x="803" y="86" width="160" height="84" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/>
      <rect x="992" y="86" width="160" height="84" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/>
    </g>
    <!-- AGENTS.md chip with a document icon -->
    <path d="M64 106h18l7 7v27h-25z" fill="#FFFFFF" stroke="#9A7B55" stroke-width="2" stroke-linejoin="round"/>
    <path d="M82 106v7h7" fill="none" stroke="#9A7B55" stroke-width="2"/>
    <path d="M69 122h14M69 128h14M69 134h9" stroke="#C9B48F" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="122">AGENTS.md</text>
    <text x="98" y="146" font-size="13" font-weight="400" fill="#6E6558">loaded first</text>

    <circle cx="261" cy="128" r="14" fill="#1F3A5F"/><text x="261" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="283" y="122">brief</text>
    <text x="283" y="146" font-size="13" font-weight="400" fill="#6E6558">where it stands</text>

    <circle cx="450" cy="128" r="14" fill="#1F3A5F"/><text x="450" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="472" y="122">Your tasks</text>
    <text x="472" y="146" font-size="13" font-weight="400" fill="#6E6558">work you hand it</text>

    <circle cx="638" cy="128" r="14" fill="#1F3A5F"/><text x="638" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="660" y="122">verify</text>
    <text x="660" y="146" font-size="13" font-weight="400" fill="#6E6558">what goes out</text>

    <circle cx="827" cy="128" r="14" fill="#1F3A5F"/><text x="827" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="849" y="122">capture</text>
    <text x="849" y="146" font-size="13" font-weight="400" fill="#6E6558">unprompted</text>

    <circle cx="1016" cy="128" r="14" fill="#1F3A5F"/><text x="1016" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="1038" y="122">handoff</text>
    <text x="1038" y="146" font-size="13" font-weight="400" fill="#6E6558">when work stops</text>
  </g>
  <g stroke="#B3A386" stroke-width="2.5" marker-end="url(#aG)">
    <path d="M211 128h20"/><path d="M400 128h20"/><path d="M589 128h19"/><path d="M777 128h20"/><path d="M966 128h20"/>
  </g>

  <!-- the folder -->
  <path d="M64 356H218l20-24H486l20 24H1136a16 16 0 0 1 16 16V568a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V372a16 16 0 0 1 16-16Z" fill="#F3EADB" stroke="#DCCBAE" stroke-width="2"/>
  <text x="362" y="351" font-size="14" font-weight="700" letter-spacing="2" fill="#9A7B55" text-anchor="middle">work/  IN YOUR FOLDER</text>

  <g filter="url(#sh)">
    <rect x="80" y="388" width="320" height="168" rx="16" fill="#FFFFFF" stroke="#E9C9B8"/>
    <rect x="440" y="388" width="320" height="168" rx="16" fill="#FFFFFF" stroke="#C9D3E1"/>
