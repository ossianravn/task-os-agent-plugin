<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">What setup does, once per project</title>
  <desc id="d">Setup reads your folder, shows you what it found, asks about the gaps one question at a time, writes the project into work/, adds its block to AGENTS.md and finishes a first task with you. You confirm the files, answer the questions, settle any conflict with your own rules, and work the first task through together. Setup saves its progress and resumes where it stopped.</desc>
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B3A386"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5B4A30" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="468" rx="28" fill="#FBF7EF" stroke="#E9DEC9" stroke-width="2"/>
  <text x="48" y="60" font-size="15" font-weight="700" letter-spacing="2" fill="#9A7B55">WHAT SETUP DOES, ONCE PER PROJECT</text>

  <!-- lanes -->
  <rect x="32" y="84" width="1136" height="176" rx="20" fill="#EEF2F7"/>
  <rect x="32" y="276" width="1136" height="128" rx="20" fill="#F8EAE2"/>
  <text x="48" y="106" font-size="12" font-weight="700" letter-spacing="2" fill="#1F3A5F">SETUP DOES</text>
  <text x="48" y="298" font-size="12" font-weight="700" letter-spacing="2" fill="#C2603A">YOU DO</text>

  <!-- step cards -->
  <g filter="url(#sh)" fill="#FFFFFF" stroke="#C9D3E1">
    <rect x="48" y="116" width="176" height="130" rx="16"/>
    <rect x="236" y="116" width="176" height="130" rx="16"/>
    <rect x="424" y="116" width="176" height="130" rx="16"/>
    <rect x="612" y="116" width="176" height="130" rx="16"/>
    <rect x="800" y="116" width="176" height="130" rx="16"/>
    <rect x="988" y="116" width="176" height="130" rx="16"/>
  </g>
  <g fill="#1F3A5F">
    <circle cx="76" cy="144" r="14"/><circle cx="264" cy="144" r="14"/><circle cx="452" cy="144" r="14"/>
    <circle cx="640" cy="144" r="14"/><circle cx="828" cy="144" r="14"/><circle cx="1016" cy="144" r="14"/>
  </g>
  <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="76" y="149">1</text><text x="264" y="149">2</text><text x="452" y="149">3</text>
    <text x="640" y="149">4</text><text x="828" y="149">5</text><text x="1016" y="149">6</text>
  </g>
  <g font-size="16" font-weight="700" fill="#1F2A33">
    <text x="64" y="188">Reads the folder</text>
    <text x="252" y="188">Shows its findings</text>
    <text x="440" y="188">Asks you</text>
    <text x="628" y="188">Writes the project</text>
    <text x="816" y="188">Adds its block</text>
    <text x="1004" y="188">Does a first task</text>
  </g>
  <g font-size="13" fill="#4D5761">
    <text x="64" y="212">notes, saved mail,</text><text x="64" y="230">exports, instructions</text>
    <text x="252" y="212">what each file is,</text><text x="252" y="230">cited to the line</text>
    <text x="440" y="212">what only you can</text><text x="440" y="230">tell it, one at a time</text>
    <text x="628" y="212">people, systems, rules,</text><text x="628" y="230">tasks and history</text>
    <text x="816" y="212">at the end of your</text><text x="816" y="230">AGENTS.md</text>
    <text x="1004" y="212">with you, then the</text><text x="1004" y="230">first handoff</text>
  </g>
  <g stroke="#B3A386" stroke-width="2.5" marker-end="url(#aG)">
    <path d="M226 181h8"/><path d="M414 181h8"/><path d="M602 181h8"/><path d="M790 181h8"/><path d="M978 181h8"/>
  </g>

  <!-- what you do -->
  <g stroke="#C2603A" stroke-width="2" stroke-dasharray="5 5">
    <path d="M324 248v60"/><path d="M512 248v60"/><path d="M888 248v60"/><path d="M1076 248v60"/>
  </g>
  <g filter="url(#sh)" fill="#FFFFFF" stroke="#E9C9B8">
    <rect x="236" y="310" width="176" height="78" rx="14"/>
    <rect x="424" y="310" width="176" height="78" rx="14"/>
    <rect x="800" y="310" width="176" height="78" rx="14"/>
    <rect x="988" y="310" width="176" height="78" rx="14"/>
  </g>
  <g font-size="15" font-weight="700" fill="#C2603A">
    <text x="252" y="342">Confirm the files</text>
    <text x="440" y="342">Answer</text>
    <text x="816" y="342">Settle conflicts</text>
    <text x="1004" y="342">Work it through</text>
  </g>
  <g font-size="13" fill="#4D5761">
    <text x="252" y="366">leave out any you like</text>
    <text x="440" y="366">four for a short job</text>
    <text x="816" y="366">with your own rules</text>
    <text x="1004" y="366">then read the files</text>
  </g>
  <g font-size="13" fill="#7A8794" font-style="italic">
    <text x="64" y="352">it works on its own</text>
    <text x="628" y="352">it works on its own</text>
  </g>

  <text x="600" y="440" font-size="14" font-weight="600" fill="#6E6558" text-anchor="middle">Setup saves its progress after every answer and resumes where it stopped. Run it again later to update the picture.</text>
</svg>
