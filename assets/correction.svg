<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">When a figure turns out wrong</title>
  <desc id="d">Anna's reported 41% for Q3 is superseded by her correction: 38.6%, because the 41% counted a test send. The correction looks up what carried the 41%: the Q3 summary in delivered/, the mail that sent it to Anna, and the PDF for the board. Your agent drafts a correction to Anna in work/drafts/ and opens task T-5, Correct the open rate where it went out, with one line for each place. Changes outside your folder wait for your OK.</desc>
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1F3A5F"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A7A76"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3A386"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5B4A30" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="598" rx="28" fill="#FBF7EF" stroke="#E9DEC9" stroke-width="2"/>

  <text x="48" y="60" font-size="15" font-weight="700" letter-spacing="2" fill="#9A7B55">WHEN A FIGURE TURNS OUT WRONG</text>
  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A7B55">
    <text x="48" y="104">IN WORK/RECORDS/</text>
    <text x="460" y="104">WHAT CARRIED IT</text>
    <text x="870" y="104">WHAT YOUR AGENT DOES</text>
  </g>

  <!-- cards -->
  <g filter="url(#sh)">
    <rect x="48" y="120" width="300" height="116" rx="14" fill="#FFFFFF" stroke="#E2D6C0" opacity="0.7"/>
    <rect x="48" y="300" width="300" height="136" rx="14" fill="#FFFFFF" stroke="#BFDDD9"/>
    <rect x="460" y="120" width="330" height="92" rx="14" fill="#FFFFFF" stroke="#E2D6C0"/>
    <rect x="460" y="232" width="330" height="92" rx="14" fill="#FFFFFF" stroke="#E2D6C0"/>
    <rect x="460" y="344" width="330" height="92" rx="14" fill="#FFFFFF" stroke="#E2D6C0"/>
    <rect x="870" y="120" width="282" height="116" rx="14" fill="#FFFFFF" stroke="#D9CCE0"/>
    <rect x="870" y="256" width="282" height="180" rx="14" fill="#FFFFFF" stroke="#EAD6A6"/>
  </g>
  <!-- accent bars -->
  <path d="M48 314a14 14 0 0 1 14-14h4v136h-4a14 14 0 0 1-14-14z" fill="#2A7A76"/>
  <path d="M870 134a14 14 0 0 1 14-14h4v116h-4a14 14 0 0 1-14-14z" fill="#6B4C7A"/>
  <path d="M870 270a14 14 0 0 1 14-14h4v180h-4a14 14 0 0 1-14-14z" fill="#D7A23A"/>

  <!-- the superseded finding -->
  <g opacity="0.75">
    <text x="72" y="150" font-size="12" font-weight="700" letter-spacing="1.2" fill="#9A7B55">FINDING · REPORTED</text>
    <text x="72" y="182" font-size="19" font-weight="700" fill="#1F2A33">Anna: Q3 open rate 41%</text>
    <path d="M70 176h232" stroke="#C2603A" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="214" font-size="14" fill="#6E6558">her mail, 1 October</text>
  </g>
  <rect x="246" y="198" width="88" height="24" rx="12" fill="#EFE9DF"/>
  <text x="290" y="215" font-size="12" font-weight="600" fill="#6E6558" text-anchor="middle">superseded</text>

  <!-- the correction -->
  <text x="84" y="330" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2A7A76">CORRECTION · REPORTED</text>
  <text x="84" y="362" font-size="19" font-weight="700" fill="#1F2A33">Anna: 38.6% for Q3</text>
  <text x="84" y="390" font-size="15" fill="#3F4A54">the 41% counted a test send</text>
  <text x="84" y="418" font-size="14" fill="#6E6558">her mail, 20 October</text>
  <rect x="262" y="402" width="72" height="24" rx="12" fill="#DCEFEC"/>
  <text x="298" y="419" font-size="12" font-weight="600" fill="#2A7A76" text-anchor="middle">current</text>

  <!-- supersedes -->
  <path d="M198 296V244" fill="none" stroke="#2A7A76" stroke-width="2.5" marker-end="url(#aT)"/>
  <rect x="210" y="257" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#BFDDD9"/>
  <text x="258" y="275" font-size="14" font-weight="600" fill="#2A7A76" text-anchor="middle">supersedes</text>

  <!-- what carried it -->
  <g fill="none" stroke="#9A7B55" stroke-width="2" stroke-linejoin="round">
    <path d="M482 142h15l6 6v22h-21z" fill="#FFFFFF"/><path d="M497 142v6h6"/>
    <rect x="481" y="258" width="24" height="17" rx="2" fill="#FFFFFF"/><path d="M481 260l12 9 12-9"/>
    <path d="M482 366h15l6 6v22h-21z" fill="#FFFFFF"/><path d="M497 366v6h6"/>
  </g>
  <text x="485" y="388" font-size="7" font-weight="700" fill="#C2603A">PDF</text>

  <g fill="#1F2A33" font-size="17" font-weight="700">
    <text x="518" y="156">Q3 summary</text>
    <text x="518" y="268">The mail that sent it</text>
    <text x="518" y="380">PDF for the board</text>
  </g>
  <g font-size="13" fill="#6E6558">
    <text x="518" y="180">delivered/…-nyhedsbrev-q3-rapport.md</text>
    <text x="518" y="200">to Anna · sent 16 October</text>
    <text x="518" y="292">mail to Anna, 16 October</text>
    <text x="518" y="312">with the summary attached</text>
    <text x="518" y="404">delivered/…-nyhedsbrev-q3-rapport.pdf</text>
    <text x="518" y="424">to Anna, who forwards it</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="690" y="134" width="86" height="22" rx="11" fill="#FBEDE6" stroke="#E9C9B8"/><text x="733" y="149" fill="#C2603A">carries 41%</text>
    <rect x="690" y="246" width="86" height="22" rx="11" fill="#FBEDE6" stroke="#E9C9B8"/><text x="733" y="261" fill="#C2603A">carries 41%</text>
    <rect x="690" y="358" width="86" height="22" rx="11" fill="#FBEDE6" stroke="#E9C9B8"/><text x="733" y="373" fill="#C2603A">carries 41%</text>
  </g>

  <!-- carried by -->
  <g fill="none" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#aN)">
    <path d="M350 352C400 352 400 166 452 166"/>
    <path d="M350 366C400 366 400 278 452 278"/>
    <path d="M350 380C400 380 400 390 452 390"/>
  </g>
  <rect x="354" y="308" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/>
  <text x="400" y="326" font-size="14" font-weight="600" fill="#1F3A5F" text-anchor="middle">carried by</text>

  <!-- what your agent does -->
  <g fill="none" stroke="#B3A386" stroke-width="2.5" marker-end="url(#aG)">
    <path d="M792 270C830 270 830 178 862 178"/>
    <path d="M792 300C830 300 830 346 862 346"/>
  </g>

  <g fill="none" stroke="#6B4C7A" stroke-width="2" stroke-linejoin="round">
    <rect x="896" y="140" width="24" height="17" rx="2" fill="#FFFFFF"/><path d="M896 142l12 9 12-9"/>
  </g>
  <text x="932" y="155" font-size="17" font-weight="700" fill="#1F2A33">Correction to Anna</text>
  <text x="896" y="186" font-size="14" fill="#3F4A54">drafted in her format and language</text>
  <text x="896" y="210" font-size="13" fill="#6E6558">waits in work/drafts/ for you to send</text>

  <text x="896" y="288" font-size="17" font-weight="700" fill="#1F2A33">T-5 Correct the open rate</text>
  <text x="896" y="310" font-size="17" font-weight="700" fill="#1F2A33">where it went out</text>
  <g font-size="14" fill="#3F4A54">
    <rect x="896" y="328" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B3A386" stroke-width="1.5"/><text x="920" y="340">the Q3 summary</text>
    <rect x="896" y="354" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B3A386" stroke-width="1.5"/><text x="920" y="366">the PDF for the board</text>
    <rect x="896" y="380" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B3A386" stroke-width="1.5"/><text x="920" y="392">the correction to Anna</text>
  </g>
  <text x="896" y="420" font-size="13" font-weight="600" fill="#C2603A">changes outside your folder: your OK first</text>

  <!-- why it can find them -->
  <g filter="url(#sh)"><rect x="48" y="468" width="1104" height="96" rx="16" fill="#FFFFFF" stroke="#E2D6C0"/></g>
  <text x="76" y="502" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A7B55">WHY IT CAN FIND THEM</text>
  <text x="76" y="532" font-size="15" fill="#3F4A54">When each one went out, its progress record listed the findings it carries, who got it and where it lives.</text>
  <text x="76" y="552" font-size="13" fill="#6E6558">deliverable: { status: sent, carries: [41% finding], recipients: [Anna], locations: [delivered/…, mail:…] }</text>
</svg>
