<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">What your agent can reach</title>
  <desc id="d">Your agent reads and writes the Task OS records in work/ and reads your own files. It reaches mail, Trello, Azure DevOps and analytics through connectors you add, and any other app or site on your screen through open-cu on Windows or macOS. Systems you reach through others arrive as exports in your files. Changes outside your folder wait for your OK.</desc>
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1F3A5F"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A7A76"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6B4C7A"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9C9384"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5B4A30" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="638" rx="28" fill="#FBF7EF" stroke="#E9DEC9" stroke-width="2"/>
  <text x="48" y="60" font-size="15" font-weight="700" letter-spacing="2" fill="#9A7B55">WHAT YOUR AGENT CAN REACH</text>

  <!-- your folder -->
  <rect x="48" y="88" width="312" height="368" rx="20" fill="#F3EADB" stroke="#DCCBAE" stroke-width="2"/>
  <text x="72" y="120" font-size="13" font-weight="700" letter-spacing="2" fill="#9A7B55">YOUR FOLDER</text>
  <g filter="url(#sh)">
    <rect x="72" y="140" width="264" height="134" rx="14" fill="#FFFFFF" stroke="#C9D3E1"/>
    <rect x="72" y="296" width="264" height="134" rx="14" fill="#FFFFFF" stroke="#E7D3A8"/>
  </g>
  <path d="M72 154a14 14 0 0 1 14-14h4v134h-4a14 14 0 0 1-14-14z" fill="#1F3A5F"/>
  <path d="M72 310a14 14 0 0 1 14-14h4v134h-4a14 14 0 0 1-14-14z" fill="#D7A23A"/>
  <g fill="#1F2A33">
    <text x="108" y="180" font-size="22" font-weight="700">work/</text>
    <text x="108" y="208" font-size="15" fill="#3F4A54">people, systems,</text>
    <text x="108" y="229" font-size="15" fill="#3F4A54">tasks, records</text>
    <text x="108" y="258" font-size="13" font-weight="600" fill="#1F3A5F">kept by Task OS</text>
    <text x="108" y="336" font-size="22" font-weight="700">Your files</text>
    <text x="108" y="364" font-size="15" fill="#3F4A54">notes, saved mail,</text>
    <text x="108" y="385" font-size="15" fill="#3F4A54">exports, deliveries</text>
    <text x="108" y="414" font-size="13" font-weight="600" fill="#9A6F14">read as sources</text>
  </g>

  <!-- reached through others -->
  <rect x="48" y="500" width="312" height="66" rx="16" fill="#F6F2EA" stroke="#B9AE9B" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="72" y="528" font-size="16" font-weight="700" fill="#5D554A">Reached through others</text>
  <text x="72" y="551" font-size="14" fill="#7A7164">someone sends you exports</text>
  <path d="M300 498V466" stroke="#9C9384" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#aG)"/>
  <text x="252" y="486" font-size="13" font-weight="600" fill="#7A7164" text-anchor="end">by mail</text>

  <!-- the agent -->
  <g filter="url(#sh)"><rect x="495" y="206" width="210" height="156" rx="26" fill="#1F3A5F"/></g>
  <text x="600" y="256" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your agent</text>
  <text x="600" y="284" font-size="15" fill="#C9D6E6" text-anchor="middle">Claude Code or Codex</text>
  <rect x="524" y="306" width="152" height="30" rx="15" fill="#2A7A76"/>
  <text x="600" y="326" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">with Task OS skills</text>

  <!-- connected tools -->
  <rect x="840" y="88" width="312" height="244" rx="20" fill="#E6F2F0" stroke="#BFDDD9" stroke-width="2"/>
  <text x="864" y="118" font-size="13" font-weight="700" letter-spacing="2" fill="#2A7A76">CONNECTED TOOLS</text>
  <text x="864" y="138" font-size="13" fill="#3F6B68">MCP servers, plugins, connectors</text>
  <g filter="url(#sh)" fill="#FFFFFF" stroke="#CFE4E1">
    <rect x="864" y="150" width="128" height="80" rx="12"/><rect x="1004" y="150" width="128" height="80" rx="12"/>
    <rect x="864" y="240" width="128" height="80" rx="12"/><rect x="1004" y="240" width="128" height="80" rx="12"/>
  </g>
  <g transform="translate(928 178) scale(0.78)" fill="none" stroke="#2A7A76" stroke-width="3.4" stroke-linejoin="round">
    <rect x="-24" y="-16" width="48" height="34" rx="5"/><path d="M-22-13 0 4 22-13"/>
  </g>
  <g transform="translate(1068 178) scale(0.78)">
    <rect x="-25" y="-18" width="50" height="38" rx="6" fill="none" stroke="#2A7A76" stroke-width="3.4"/>
    <rect x="-17" y="-10" width="12" height="22" rx="2" fill="#2A7A76"/><rect x="2" y="-10" width="12" height="13" rx="2" fill="#2A7A76"/>
  </g>
  <g transform="translate(928 268) scale(0.78)" fill="none" stroke="#2A7A76" stroke-width="3.4" stroke-linecap="round">
    <circle cx="-18" cy="-12" r="6"/><circle cx="-18" cy="14" r="6"/><circle cx="18" cy="0" r="6"/>
    <path d="M-18-6v14M-12-12c14 0 18 4 24 8"/>
  </g>
  <g transform="translate(1068 268) scale(0.78)" fill="#2A7A76">
    <rect x="-22" y="0" width="10" height="16" rx="2"/><rect x="-6" y="-10" width="10" height="26" rx="2"/><rect x="10" y="-20" width="10" height="36" rx="2"/>
    <path d="M-26 20h50" stroke="#2A7A76" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1F2A33" text-anchor="middle">
    <text x="928" y="218">Mail</text><text x="1068" y="218">Trello</text>
    <text x="928" y="308">Azure DevOps</text><text x="1068" y="308">Analytics</text>
  </g>

  <!-- on screen with open-cu -->
  <rect x="840" y="352" width="312" height="200" rx="20" fill="#F1EAF4" stroke="#D8C8E0" stroke-width="2"/>
  <text x="864" y="382" font-size="13" font-weight="700" letter-spacing="2" fill="#6B4C7A">ON YOUR SCREEN, WITH OPEN-CU</text>
  <g filter="url(#sh)" fill="#FFFFFF" stroke="#E2D5E8">
    <rect x="864" y="396" width="268" height="58" rx="12"/><rect x="864" y="462" width="268" height="58" rx="12"/>
  </g>
  <g transform="translate(896 425)" fill="none" stroke="#6B4C7A" stroke-width="2.6" stroke-linejoin="round">
    <rect x="-16" y="-12" width="32" height="24" rx="4"/><path d="M-16-5h32"/>
    <circle cx="-11" cy="-8.5" r="1.2" fill="#6B4C7A" stroke="none"/><circle cx="-7" cy="-8.5" r="1.2" fill="#6B4C7A" stroke="none"/>
  </g>
  <g transform="translate(896 491)" fill="none" stroke="#6B4C7A" stroke-width="2.6" stroke-linejoin="round">
    <rect x="-16" y="-12" width="32" height="24" rx="4"/><path d="M-6-12v24"/><path d="M-1-4h11M-1 2h8" stroke-linecap="round"/>
  </g>
  <g fill="#1F2A33">
    <text x="924" y="421" font-size="15" font-weight="700">Any site in your browser</text>
    <text x="924" y="440" font-size="13" fill="#5E5266">boards, CRMs, portals, webmail</text>
    <text x="924" y="487" font-size="15" font-weight="700">Any app you can open</text>
    <text x="924" y="506" font-size="13" fill="#5E5266">Outlook, Excel, in-house tools</text>
  </g>
  <text x="864" y="540" font-size="12.5" font-weight="600" fill="#6B4C7A">Windows and macOS · setup recommends it</text>

  <!-- connections -->
  <g fill="none" stroke-width="2.5">
    <path d="M340 207C410 207 430 250 489 250" stroke="#1F3A5F" marker-start="url(#aN)" marker-end="url(#aN)"/>
    <path d="M340 363C410 363 430 318 489 318" stroke="#1F3A5F" stroke-dasharray="7 7" marker-end="url(#aN)"/>
    <path d="M711 250C770 250 784 210 834 210" stroke="#2A7A76" marker-end="url(#aT)"/>
    <path d="M711 318C770 318 784 452 834 452" stroke="#6B4C7A" marker-end="url(#aP)"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="364" y="164" width="118" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/><text x="423" y="182" fill="#1F3A5F">reads and writes</text>
    <rect x="392" y="374" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3E1"/><text x="423" y="392" fill="#1F3A5F">reads</text>
    <rect x="718" y="176" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#BFDDD9"/><text x="773" y="194" fill="#2A7A76">a connector</text>
    <rect x="726" y="398" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#D8C8E0"/><text x="774" y="416" fill="#6B4C7A">on screen</text>
  </g>

  <!-- footnote -->
  <g transform="translate(420 578)">
    <path d="M14 2 26 7v10c0 8-5 13-12 16C7 30 2 25 2 17V7z" fill="#F8EAE2" stroke="#C2603A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M8 17l4 4 8-9" fill="none" stroke="#C2603A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="15" font-size="14" font-weight="700" fill="#1F2A33">Changes outside your folder wait for your OK.</text>
    <text x="40" y="36" font-size="14" fill="#3F4A54">Task OS works only with your files; work/systems/ records how you reach each system.</text>
  </g>
</svg>
