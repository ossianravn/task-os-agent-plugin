schema_version: 1
id: <workspace id>            # never changes
kind: hub
name: <engagement name>
timezone: <IANA timezone, such as Europe/Copenhagen>
language: { default: <en>, client_facing: <da> }
mappings:                     # existing files, read as sources and never rewritten
  legacy_log: <path>          # omit when there is none
  communication_doc: <path>   # omit when there is none
  source_roots: []            # folders or single files; text files are read as sources
  source_exclude: []          # never read as sources
modules: { grill: false, writing: false, jev-9000: false, open-cu: false }
integrations: []              # systems reached directly through a host connection: { system, resource }
