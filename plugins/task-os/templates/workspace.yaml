schema_version: 1
id: <workspace id>            # never changes
kind: hub
name: <project name>
timezone: <IANA timezone, such as Europe/Copenhagen>
language: { default: <en>, outgoing: <da> }   # outgoing: text other people read
mappings:                     # existing files and folders; no existing file is rewritten
  legacy_log: <path>          # omit when there is none
  communication_docs: []      # how to write to whom; read before writing to anyone
  source_roots: []            # raw material: exports, saved mail, tickets; folders or single files, read as sources
  deliverable_roots: []       # what was made for others; searched, and new deliverables go in the first one
  source_exclude: []          # never read
modules: { grill: false, writing: false, jev-9000: false, open-cu: false, pele-board: false }
integrations: []              # systems reached directly through a host connection: { system, resource }
